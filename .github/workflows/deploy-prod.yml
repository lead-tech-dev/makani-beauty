name: Deploy → Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PROD_FRONTEND_URL || 'https://makani-cosmetique.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend to Vercel (production)
        if: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel pull --yes --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
          npx --yes vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx --yes vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Trigger backend deploy hook (production)
        if: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"

      - name: Wait for backend health
        env:
          BACKEND_HEALTH_URL: ${{ vars.PROD_BACKEND_HEALTH_URL || 'https://api.makani-cosmetique.com/health' }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL "$BACKEND_HEALTH_URL" > /dev/null 2>&1; then
              echo "Backend healthy at $BACKEND_HEALTH_URL"
              exit 0
            fi
            echo "Waiting for backend ($BACKEND_HEALTH_URL)... ($i/30)"
            sleep 10
          done
          echo "::error::Backend did not become healthy within 5 minutes at $BACKEND_HEALTH_URL — investigate before celebrating"
          exit 1

      - name: Smoke test backend endpoints
        env:
          BACKEND_HEALTH_URL: ${{ vars.PROD_BACKEND_HEALTH_URL || 'https://api.makani-cosmetique.com/health' }}
        run: |
          BASE_URL="${BACKEND_HEALTH_URL%/health}"
          chmod +x scripts/smoke.sh
          scripts/smoke.sh "$BASE_URL"

      - uses: getsentry/action-release@v1
        if: ${{ secrets.SENTRY_AUTH_TOKEN }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: makani-cosmetique
        with:
          environment: production
          version: ${{ github.ref_name }}

      - name: Notify Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -fsSL -X POST -H 'Content-Type: application/json' \
            -d '{"text":"🚀 Makani Cosmétique `${{ github.ref_name }}` déployé en prod"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
