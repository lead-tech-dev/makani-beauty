name: Deploy → Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PROD_FRONTEND_URL || 'https://makani-cosmetique.com' }}
    # Map secrets to env vars at job scope — GitHub Actions forbids evaluating
    # `secrets.X` directly inside step-level `if:` for security reasons.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RENDER_PROD_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy frontend to Vercel (production)
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        working-directory: frontend

      - name: Trigger backend deploy hook (production)
        if: env.RENDER_PROD_DEPLOY_HOOK != ''
        run: curl -fsSL -X POST "$RENDER_PROD_DEPLOY_HOOK"

      # Wait + smoke require PROD_BACKEND_HEALTH_URL to be set as a GitHub var.
      - name: Wait for backend health
        if: vars.PROD_BACKEND_HEALTH_URL != ''
        env:
          BACKEND_HEALTH_URL: ${{ vars.PROD_BACKEND_HEALTH_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL "$BACKEND_HEALTH_URL" > /dev/null 2>&1; then
              echo "Backend healthy at $BACKEND_HEALTH_URL"
              exit 0
            fi
            echo "Waiting for backend ($BACKEND_HEALTH_URL)... ($i/30)"
            sleep 10
          done
          echo "::error::Backend did not become healthy within 5 minutes at $BACKEND_HEALTH_URL — investigate before celebrating"
          exit 1

      - name: Smoke test backend endpoints
        if: vars.PROD_BACKEND_HEALTH_URL != ''
        env:
          BACKEND_HEALTH_URL: ${{ vars.PROD_BACKEND_HEALTH_URL }}
        run: |
          BASE_URL="${BACKEND_HEALTH_URL%/health}"
          chmod +x scripts/smoke.sh
          scripts/smoke.sh "$BASE_URL"

      - name: Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v1
        env:
          SENTRY_PROJECT: makani-cosmetique
        with:
          environment: production
          version: ${{ github.ref_name }}

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -fsSL -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚀 Makani Cosmétique \`${GITHUB_REF_NAME}\` déployé en prod\"}" \
            "$SLACK_WEBHOOK_URL"
