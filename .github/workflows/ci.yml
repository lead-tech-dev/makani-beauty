name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint -- --max-warnings=0
        continue-on-error: true # ESLint is permissive — don't block on lint until rules are tightened
      - name: Build
        run: npm run build
      - name: Audit (high severity only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  frontend:
    name: Frontend (CRA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        env:
          CI: 'true'
          # Skip the production-only checks that require env vars not present in CI
          REACT_APP_API_URL: http://localhost:3002/api
        run: npm run build
      - name: Audit (high severity only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
