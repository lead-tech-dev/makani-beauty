name: Deploy → Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      # Override via GitHub var STAGING_FRONTEND_URL once the domain or platform subdomain is known.
      url: ${{ vars.STAGING_FRONTEND_URL || 'https://staging.makani-cosmetique.com' }}
    # Map secrets to env vars at job scope — GitHub Actions forbids evaluating
    # `secrets.X` directly inside step-level `if:` for security reasons.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
    steps:
      - uses: actions/checkout@v4

      # Frontend → Vercel preview/staging deployment
      - name: Deploy frontend to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel build --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prebuilt --token="$VERCEL_TOKEN"
        working-directory: frontend

      # Backend → Render / Railway / Fly via webhook (skipped on Koyeb — uses GitHub auto-deploy)
      - name: Trigger backend deploy hook (Render)
        if: env.RENDER_STAGING_DEPLOY_HOOK != ''
        run: curl -fsSL -X POST "$RENDER_STAGING_DEPLOY_HOOK"

      - name: Wait for backend health
        env:
          BACKEND_HEALTH_URL: ${{ vars.STAGING_BACKEND_HEALTH_URL || 'https://api-staging.makani-cosmetique.com/health' }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL "$BACKEND_HEALTH_URL" > /dev/null 2>&1; then
              echo "Backend healthy at $BACKEND_HEALTH_URL"
              exit 0
            fi
            echo "Waiting for backend ($BACKEND_HEALTH_URL)... ($i/30)"
            sleep 10
          done
          echo "::warning::Backend did not become healthy within 5 minutes at $BACKEND_HEALTH_URL"

      - name: Smoke test backend endpoints
        env:
          BACKEND_HEALTH_URL: ${{ vars.STAGING_BACKEND_HEALTH_URL || 'https://api-staging.makani-cosmetique.com/health' }}
        run: |
          BASE_URL="${BACKEND_HEALTH_URL%/health}"
          chmod +x scripts/smoke.sh
          scripts/smoke.sh "$BASE_URL"

      # Sentry source maps + release tracking
      - name: Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v1
        env:
          SENTRY_PROJECT: makani-cosmetique
        with:
          environment: staging
          version: ${{ github.sha }}
